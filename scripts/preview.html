<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OmaCapy preview</title>
  <style>
    @font-face { font-family: JB; src: url("file:///usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: JB; src: url("file:///usr/share/fonts/TTF/JetBrainsMonoNerdFont-Bold.ttf"); font-weight: 700; }
    html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; }
    body {
      font-family: JB, ui-monospace, monospace;
      color: #ece8df;
      background: #0b0b0d;
    }
    .desk {
      position: relative; width: 1280px; height: 720px;
      background:
        radial-gradient(1100px 620px at 12% 110%, #5a2e18 0%, transparent 42%),
        radial-gradient(900px 520px at 88% 0%, #1c2433 0%, transparent 48%),
        linear-gradient(180deg, #14110e 0%, #0b0b0d 55%);
    }
    .bar {
      position: absolute; left: 16px; right: 16px; top: 10px; height: 36px;
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 12px;
      border-radius: 10px;
      background: #141318f0;
      border: 1px solid #2a2722;
    }
    .mid { display: flex; align-items: center; gap: 10px; justify-self: center; }
    .ws { display: flex; gap: 10px; color: #8b8680; font-size: 12px; }
    .ws b { color: #f3efe6; }
    .clock { color: #cfc8bc; font-size: 12px; }
    .right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: #8b8680; font-size: 11px; }
    .badge {
      display: flex; align-items: center; gap: 6px;
      height: 24px; padding: 0 8px 0 3px;
      border-radius: 999px;
      background: #2a1d0c;
      color: #f6d27a; font-size: 11px; font-weight: 700;
    }
    .badge img { width: 18px; height: 18px; object-fit: contain; }

    .panel {
      position: absolute; left: 50%; top: 120px; width: 360px;
      transform: translateX(-50%);
      padding: 16px;
      border-radius: 14px;
      background: #141318f5;
      border: 1px solid #353028;
      box-shadow: 0 24px 70px #0008;
    }
    .hero { display: flex; align-items: center; gap: 12px; }
    .hero img { width: 64px; height: 68px; object-fit: contain; flex: 0 0 auto; }
    .copy { flex: 1; min-width: 0; }
    .title-row { display: flex; align-items: baseline; gap: 8px; }
    .title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
    .mood { color: #e39b2b; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; }
    .meta { margin-top: 3px; color: #9c958a; font-size: 11px; }

    .meter {
      display: grid; grid-template-columns: 78px 1fr 28px;
      align-items: center; gap: 8px; margin-top: 5px;
    }
    .meter .k { color: #8b8680; font-size: 10px; letter-spacing: 0.06em; }
    .meter .v { color: #ece8df; font-size: 11px; font-weight: 700; text-align: right; }
    .track { height: 4px; border-radius: 99px; background: #2a2724; overflow: hidden; }
    .fill { height: 100%; border-radius: 99px; background: #e39b2b; }

    .acts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin-top: 12px;
    }
    .act {
      height: 34px; display: grid; place-items: center;
      border-radius: 8px; font-size: 12px; border: 1px solid #353028;
    }
    .act.sel { background: #2a2218; border-color: #c98422; }
    .quote {
      margin-top: 10px; padding: 8px 10px; border-radius: 8px;
      background: #2a2218; color: #cfc8bc; font-size: 11px; line-height: 1.4;
    }
    .sides { display: flex; gap: 6px; margin-top: 10px; }
    .sides span {
      flex: 1; height: 28px; display: grid; place-items: center;
      border-radius: 8px; border: 1px solid #353028; font-size: 11px; color: #cfc8bc;
    }
    .sides .on { background: #2a2218; border-color: #c98422; color: #f6d27a; }
  </style>
</head>
<body>
  <div class="desk">
    <div class="bar">
      <div class="ws"><b>1</b><span>2</span><span>3</span><span>4</span><span>5</span></div>
      <div class="mid">
        <div class="clock">Thursday 14:18</div>
        <div class="badge"><img src="../capy.png" alt="">Capy</div>
      </div>
      <div class="right">
        <span>󰤨</span><span>󰕾</span><span>󰁹</span>
      </div>
    </div>
    <section class="panel">
      <div class="hero">
        <img src="../capy.png" alt="">
        <div class="copy">
          <div class="title-row">
            <div class="title">OmaCapy</div>
            <div class="mood">CHILL</div>
          </div>
          <div class="meta">visitor  ·  CPU 0.42</div>
          <div class="meter"><div class="k">HAPPINESS</div><div class="track"><div class="fill" style="width:72%"></div></div><div class="v">72%</div></div>
          <div class="meter"><div class="k">SNACKS</div><div class="track"><div class="fill" style="width:58%"></div></div><div class="v">58%</div></div>
          <div class="meter"><div class="k">ZEN</div><div class="track"><div class="fill" style="width:80%"></div></div><div class="v">80%</div></div>
        </div>
      </div>
      <div class="acts">
        <div class="act sel">Pet  ·  1</div>
        <div class="act">Orange</div>
        <div class="act">Soak</div>
        <div class="act">Wisdom</div>
      </div>
      <div class="quote">If it is not a river problem, stand still like a capy.</div>
      <div class="sides">
        <span>Left</span><span class="on">Center</span><span>Right</span>
      </div>
    </section>
  </div>
</body>
</html>
